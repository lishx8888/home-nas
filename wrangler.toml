# Cloudflare Workers 部署配置（详细步骤见 Cloudflare部署说明.md）
# 部署命令：npx wrangler deploy

name = "home-nav"
main = "workers/worker.js"
compatibility_date = "2026-10-20"

# 静态资源：整个仓库目录作为站点文件；Worker 对所有请求先行处理，
# /api.php 走 KV 接口，其余路径回退到静态资源。不要公开的文件用 .assetsignore 排除。
assets = { directory = ".", binding = "ASSETS", run_worker_first = true }

# KV 存储命名空间：先执行 npx wrangler kv namespace create NAV
# 把输出中的 id 粘到下面，再部署；已有数据的命名空间 id 不要改动。
[[kv_namespaces]]
binding = "NAV"
id = "粘贴 wrangler kv namespace create NAV 返回的 id"

# 忘记密码时临时改为 "true"，在主页重新设置密码后改回 "false"（对应 api.php 的 PASSWORD_RESET）。
[vars]
PASSWORD_RESET = "false"
